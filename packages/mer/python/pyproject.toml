[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-mer"
version = "0.1.0"
description = "Portable Machine Economic Receipt signing and explicit-trust verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cryptography>=46,<50"]

[project.urls]
Homepage = "https://axiomrelay.io/developers/mer"
Repository = "https://github.com/Itr3k/axiom-relay-discovery"
Issues = "https://github.com/Itr3k/axiom-relay-discovery/issues"

[project.scripts]
axiom-mer = "axiom_mer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiom_mer = ["data/*.json"]
